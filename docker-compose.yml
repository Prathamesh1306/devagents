name: devagents

services:
  postgres:
    image: postgres:16-alpine
    container_name: devagents_postgres
    restart: always
    environment:
      POSTGRES_USER: devagents
      POSTGRES_PASSWORD: devagents_pass
      POSTGRES_DB: devagents_db
    ports:
      - "5433:5432"
    volumes:
      - devagents_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devagents -d devagents_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devagents_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: devagents_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - devagents_ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ollama-init:
    image: ollama/ollama:latest
    container_name: devagents_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.1 && echo 'Ollama llama3.1 model ready.'"]

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: devagents_api
    restart: always
    ports:
      - "8005:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://devagents:devagents_pass@postgres:5432/devagents_db}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: devagents_worker
    restart: always
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://devagents:devagents_pass@postgres:5432/devagents_db}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    container_name: devagents_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_started

volumes:
  devagents_pgdata:
  devagents_ollama_models:
