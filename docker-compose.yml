name: devagents

services:
  postgres:
    image: postgres:16-alpine
    container_name: devagents_postgres
    restart: always
    environment:
      POSTGRES_USER: devagents
      POSTGRES_PASSWORD: devagents_pass
      POSTGRES_DB: devagents_db
    ports:
      - "5433:5432"
    volumes:
      - devagents_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devagents -d devagents_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devagents_redis
    restart: always
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: devagents_api
    restart: always
    ports:
      - "8005:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://devagents:devagents_pass@postgres:5432/devagents_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - API_HOST=0.0.0.0
      - API_PORT=8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: devagents_worker
    restart: always
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://devagents:devagents_pass@postgres:5432/devagents_db
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  devagents_pgdata:
